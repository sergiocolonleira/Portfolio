<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Sergio Colón</title>

    <meta
    name="description"
    content="Contacta con Sergio Colón para proyectos de desarrollo web, programación y análisis de datos."
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="estilos/estilos.css">
</head>

<body>
<header class="cabecera">

    <a
        href="https://github.com/sergiocolonleira"
        class="logo"
        aria-label="Ir al perfil de GitHub de Sergio Colón"
        target="_blank"
        rel="noopener noreferrer"
    >
        SC
    </a>

    <nav aria-label="Navegación principal">
        <ul>
            <li>
                <a href="index.html">Inicio</a>
            </li>

            <li>
                <a href="sobre-mi.html">Sobre mí</a>
            </li>

            <li>
                <a href="index.html#proyectos">Proyectos</a>
            </li>
        </ul>
    </nav>

    <a href="contacto.html" class="contactame">
        Contacto
    </a>

</header>
    <main class="container my-5">

        <section>

            <h2 class="mb-4">Contacta conmigo</h2>
            <p class="lead">
                Si quieres contactar conmigo para hablar sobre un proyecto,
                colaboración o cualquier otra cuestión, puedes utilizar
                este formulario.
            </p>
            <form>
                <div class="mb-3">

                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>
                <div class="mb-3">

                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="correo"
                        name="correo"
                        required
                    >

                </div>
                <div class="mb-3">

                    <label for="mensaje" class="form-label">
                        Mensaje
                    </label>

                    <textarea
                        class="form-control"
                        id="mensaje"
                        name="mensaje"
                        rows="5"
                        required
                    ></textarea>

                </div>
                <button type="submit" class="btn btn-primary">
                    Enviar mensaje
                </button>

            </form>

        </section>
        <section class="mt-5">

            <h2>Redes profesionales</h2>

            <p>
                <a
                    href="https://github.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-dark"
                >
                    Mi GitHub
                </a>
            </p>

        </section>

    </main>
    <footer>
        <p>&copy; 2026 Sergio Colón - Portfolio personal</p>
    </footer>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
